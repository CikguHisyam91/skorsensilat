.b-ok{background:var(--ok);color:#fff}.b-wait{background:var(--warn);color:#fff}.b-ud{background:var(--bad);color:#fff}.b-gold{background:var(--accent2);color:#1b1b1b}

.juristat{align-items:center;display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.chip{padding:9px 14px;border-radius:12px;font-weight:800;font-size:13px}
.chip.done{color:var(--ok)}.chip.cwait{color:var(--bad)}
table{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:14px}
th{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 8px;letter-spacing:.5px}
td{padding:9px 8px;background:var(--bg2)}

.lock{padding:14px 18px;border-radius:14px;background:var(--ok);color:#fff;font-weight:800;margin-bottom:14px}

.jhead{position:sticky;top:0;z-index:5;padding:12px 14px;margin:-16px -16px 14px;background:var(--bg);box-shadow:0 6px 14px var(--lo)}

.jfoot{position:sticky;bottom:0;padding:12px 14px;margin:0 -16px -16px;background:var(--bg);box-shadow:0 -6px 14px var(--lo);display:flex;gap:12px;align-items:center}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:12px 0}

.jh{display:flex;align-items:center;gap:10px}

.jh .ti{flex:1;min-width:0;line-height:1.15}
.jh .ti b{font-size:17px}
.jh .ti span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}.dot.on{background:var(--ok)}
.ib{padding:9px 11px;font-size:14px;flex:none}
.jinfo{display:flex;gap:12px;align-items:center;padding:12px 14px;margin-bottom:14px}
.jinfo .giliran{width:62px;height:62px;font-size:30px;border-radius:16px;flex:none}
.jinfo .nama{font-size:18px}
.item .t{flex-direction:column;align-items:flex-start;gap:6px}
@media(max-width:480px){
  .wrap{padding:12px}.jhead{margin:-12px -12px 12px;padding:10px 12px}.jfoot{margin:0 -12px -12px;padding:10px 12px}

}
.kr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--lo)}
.kr:last-child{border:0}.kn{flex:1;min-width:0;line-height:1.15}.kn b{display:block;font-size:15px}.kn span{font-size:11px}
.kc{min-width:38px;text-align:center;font-size:20px;font-weight:900}
.kp1{padding:11px 12px;font-size:13px;color:var(--bad);flex:none}
.grp{margin:12px 0 2px;padding:6px 10px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:var(--accent2);color:#1b1b1b}
.btn.dqb{width:100%;color:var(--bad);border:2px solid var(--bad);margin-bottom:14px}

.dqban{padding:12px 14px;border-radius:12px;background:var(--bad);color:#fff;font-weight:800;margin-top:12px;font-size:14px}
</style>

/* Tunggal peringkat Pra Tunas–Dini: Jurus 1–7 (Tangan Kosong) sahaja, 1:30 */
/* Tunggal sahaja: KP boleh pilih Jurus 1 hingga N (Regu sentiasa 12 jurus penuh). Kod jenis 'PT@7' = Tunggal Jurus 1–7 */
const indukJenis=j=>String(j).split('@')[0].replace(/^PTK$/,'PT');
const bilJurus=j=>{if(indukJenis(j)!=='PT')return 0;const B=BORANG[indukJenis(j)];return B&&B.sek[0].item[0]&&B.sek[0].item[0].kira?B.sek[0].item.length:0;};
function pastiBorang(j){
  if(BORANG[j])return BORANG[j];
  const b=indukJenis(j),n=j==='PTK'?7:+String(j).split('@')[1],B0=BORANG[b];if(!B0||!n)return null;
  const it=B0.sek[0].item.slice(0,n);
  return BORANG[j]=Object.assign({},B0,{nama:B0.nama+' (Jurus 1–'+n+')',sembunyi:true,induk:b,
    sek:[Object.assign({},B0.sek[0],{base:it[n-1].hingga,item:it})].concat(B0.sek.slice(1))});
}
function jenisDgnJurus(j,n){const b=indukJenis(j),T=bilJurus(b);if(!T||!n||n>=T)return b;const x=b+'@'+n;pastiBorang(x);return x;}
const jurusLalai=(j,acara)=>{const b=indukJenis(j);return b==='PT'&&usiaMuda(acara)?7:bilJurus(b);};
function jenisSebenar(j,acara){return jenisDgnJurus(j,jurusLalai(j,acara));}
function masaLalai(j,acara){const b=indukJenis(j),B=BORANG[b];if(B.format==='PESAKA'&&usiaMuda(acara)&&(b==='PS'||b==='PT'))return 90;return B.masa?B.masa.sasaran:(b==='III'?180:120);}
function jurusOpsyen(j,pilih){const T=bilJurus(j);return Array.from({length:T},(_,i)=>i+1).map(n=>{const it=BORANG[indukJenis(j)].sek[0].item[n-1];
  return `<option value="${n}" ${n===pilih?'selected':''}>Jurus 1 – ${n}  (${it.hingga} gerakan · nilai ${it.hingga})</option>`;}).join('');}

function skorJuri(jenis,v){
  const B=BORANG[jenis];let jum=0,sek={};
  B.sek.forEach(s=>{let t=0;s.item.forEach(it=>{const x=v&&v[it.k]!=null?v[it.k]:it.m;t+=x;});if(s.base!=null)t=s.base-t;sek[s.k]=t;jum+=t;});
  return{jum,sek};
}
function tolakMasa(kat,saat){
  if(saat==null)return 0;const M=kat.masa;const d=saat-M.sasaran;
  let beza=0;if(d<0)beza=-d-(M.toleransi||0);else if(M.tolakLebih)beza=d-(M.toleransi||0);
  if(beza<=0)return 0;const t=(M.tier||[]).find(x=>beza>=x.dari&&beza<=x.hingga);return t?+t.tolak:0;
}
function tolakKes(senarai,kat){
  let t=0;(kat?senaraiTolak(kat):PENOLAKAN).forEach(p=>{const n=(senarai&&senarai[p.k])||0;let v=n*p.v;if(p.max)v=Math.min(v,p.max);t+=v;});return t;
}
function kira(kat){
  const nJ=kat.bilJuri||3;
  const rows=kat.peserta.map(p=>{
    const m=kat.markah[p.id]||{};const j=[];let kasar=0,wir=0,ada=0;
    const sk=[];for(let i=1;i<=nJ;i++){const r=m[i];if(r){const s=skorJuri(kat.jenis,r.v);j.push(s.jum);sk.push({i,jum:s.jum,A:s.sek.A});ada++;}else j.push(null);}
    let guna=sk,buang=[];
    if(kat.buangHL&&nJ===5&&sk.length===5){const o=sk.slice().sort((a,b)=>a.jum-b.jum);buang=[o[0].i,o[4].i];guna=o.slice(1,4);}
    guna.forEach(x=>{kasar+=x.jum;wir+=x.A;});
    let purata=null,median=null;
    if(guna.length){purata=Math.round(guna.reduce((t,x)=>t+x.jum,0)/guna.length*100)/100;
      const o=guna.map(x=>x.jum).sort((a,b)=>a-b),h=Math.floor(o.length/2);median=o.length%2?o[h]:(o[h-1]+o[h])/2;}
    if(kat.kaedah==='purata'&&guna.length){kasar=purata;wir=Math.round(wir/guna.length*100)/100;}
    if(kat.kaedah==='median'&&guna.length){kasar=median;wir=Math.round(wir/guna.length*100)/100;}
    const saat=kat.rekodMasa[p.id];const tm=tolakMasa(kat,saat);const tk=tolakKes(kat.tolak[p.id],kat);
    const lengkap=ada===nJ;
    const jdq=[];for(let i=1;i<=nJ;i++)if(m[i]&&m[i].dq)jdq.push({j:i,sebab:m[i].dq.sebab});
    const dqCadangan=jdq.map(x=>'J'+x.j+': '+x.sebab).join(' | ');
    return{...p,jdq,dqCadangan,dqCukup:jdq.length>=Math.ceil(nJ*2/3),dqSebab:p.dqSebab||dqCadangan,j,buang,ada,lengkap:lengkap&&(!jdq.length||!!p.dq),kasar,wiraga:wir,saat,tm,tk,tolak:tm+tk,jumlah:Math.round((kasar-tm-tk)*100)/100,purata,median,
      beza:saat==null?1e9:Math.abs(saat-kat.masa.sasaran)};
  });
  if(kat.skala10){const M=maksBorang(kat.jenis);rows.forEach(r=>{if(r.ada)r.papar=(r.jumlah/M*10).toFixed(2);});}
  const sah=rows.filter(r=>!r.ud&&r.lengkap).sort((a,b)=>b.jumlah-a.jumlah||b.wiraga-a.wiraga||a.beza-b.beza||a.tolak-b.tolak);
  sah.forEach((r,i)=>{r.kedudukan=i+1;const p=sah[i-1];
    if(p&&p.jumlah===r.jumlah){r.seri=true;p.seri=true;
      if(p.wiraga===r.wiraga&&p.beza===r.beza&&p.tolak===r.tolak){r.kedudukan=p.kedudukan;}}});
  return{rows,sah};
}

function parseCSV(text){
  text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  const first=text.split('\n').find(l=>l.trim())||'';
  const cnt=d=>first.split(d).length;
  const delim=['\t',';',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"'&&f.trim()==='')q=true;
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  row.push(f);rows.push(row);
  return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x));
}
function keSenarai(rows){
  if(!rows.length)return[];
  let iU=-1,iN=-1,iP=-1,mula=0;
  const h=rows[0].map(x=>x.toLowerCase());
  if(h.some(x=>/undian|giliran|^no|bil|nama|pasukan|sekolah|negeri/.test(x))){
    iU=h.findIndex(x=>/undian|giliran|^no/.test(x));if(iU<0)iU=h.findIndex(x=>/bil/.test(x));
    iN=h.findIndex(x=>/nama/.test(x));iP=h.findIndex(x=>/pasukan|sekolah|negeri|kontinjen|daerah/.test(x));mula=1;
  }else{
    const r0=rows[0];
    if(/^\d+$/.test(r0[0])){iU=0;iN=1;iP=r0.length>2?2:-1;}else{iN=0;iP=r0.length>1?1:-1;}
  }
  if(iN<0)iN=iU===0?1:0;
  return rows.slice(mula).map((r,i)=>({undian:iU>=0&&r[iU]?r[iU].replace(/\D/g,'')||String(i+1):String(i+1),nama:r[iN]||'',pasukan:iP>=0?(r[iP]||''):''}))
    .filter(x=>x.nama);
}
function bacaFail(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{let t=r.result;if(t.includes('\uFFFD')){const r2=new FileReader();r2.onload=()=>res(r2.result);r2.readAsText(file,'windows-1252');}else res(t);};
    r.readAsText(file,'utf-8');
  });
}

    set:(p,v)=>d.ref(p).set(v),

/* Semua tindakan KP/DJ ditulis terus ke Firebase */
async function kp(op,p){
  const k=ST.kat;if(!k)return;const base='pub/kat/'+k.id;
  if(k.sah)return toast('Keputusan telah DISAHKAN. Tidak boleh diubah.',true);
  try{switch(op){
    case 'tetapan':{const jn=p.jurus?jenisDgnJurus(k.jenis,p.jurus):k.jenis;if(jn!==k.jenis&&Object.keys(k.markah).length){toast('Tidak boleh tukar bilangan jurus: markah sudah ada.',true);return;}
      await DB.update(base,{jenis:jn,nama:p.nama,acara:p.acara,tarikh:p.tarikh||'',masa:p.masa,kaedah:p.kaedah,bilJuri:p.bilJuri,buangHL:!!p.buangHL,skala10:!!p.skala10});
      await DB.update('pub/meta/senarai/'+k.id,{nama:p.nama,acara:p.acara,jenis:jn});break;}
    case 'peserta':{const lama={};k.peserta.forEach(x=>lama[x.undian+'|'+x.nama]=x);const o={};
      p.forEach(x=>{const l=lama[x.undian+'|'+x.nama];o[l?l.id:uidBaru()]={undian:x.undian,nama:x.nama,pasukan:x.pasukan||'',ud:l?!!l.ud:false};});
      await DB.set(base+'/peserta',o);break;}
    case 'semasa':await DB.set(base+'/semasa',p||'');break;
    case 'ud':{const up={};up['peserta/'+p.id+'/ud']=!!p.ud;up['peserta/'+p.id+'/dq']=!!(p.ud&&p.dq);up['peserta/'+p.id+'/dqSebab']=p.ud&&p.dq?(p.sebab||''):null;if(p.ud&&k.semasa===p.id)up.semasa=seterusnya(k,p.id);await DB.update(base,up);break;}
    case 'masa':await DB.set(base+'/rekodMasa/'+p.id,p.saat);break;
    case 'tolak':await DB.set(base+'/tolak/'+p.id,p.senarai);break;
    case 'papar':await DB.set(base+'/paparMarkah',!!p);break;
    case 'resetJuri':await DB.remove(base+'/markah/'+p.id+'/'+p.j);break;
    case 'sah':await DB.update(base,{keputusan:p.keputusan,sah:{oleh:p.oleh,dj:p.dj,masa:Date.now()}});hantarSheet(k,p);break;
  }}catch(e){toast('Gagal: '+salahMsg(e),true);throw e;}
}

  const q=qrcode(0,'M');q.addData(teks);q.make();return q.createSvgTag({cellSize:8,margin:2,scalable:true});
}

  d.jenis=bilJurus(d.jenis)?jenisDgnJurus(d.jenis,+$('#nkJurus').value):d.jenis;

/* Cipta kategori (digunakan oleh borang & import pukal) */

    peserta:pesertaObj||null,
    masa:Object.assign(BORANG[d.jenis].masa?JSON.parse(JSON.stringify(BORANG[d.jenis].masa)):{toleransi:0,tolakLebih:false,tier:[{dari:1,hingga:10,tolak:5},{dari:11,hingga:20,tolak:10},{dari:21,hingga:9999,tolak:15}]},{sasaran:d.sasaran}),semasa:'',paparMarkah:false,dicipta:Date.now()};

async function padamKat(id){
  try{await DB.remove('pub/kat/'+id);const m=ST.meta;const up={};up['senarai/'+id]=null;
    if(m.aktif===id){const lain=m.senarai.find(x=>x.id!==id);up.aktif=lain?lain.id:'';}
    await DB.update('pub/meta',up);LIHAT='';katDipantau=null;}catch(e){toast('Gagal: '+salahMsg(e),true);}
}

async function bacaPukal(f){
  if(!f)return;const rows=parseCSV(await bacaFail(f));if(rows.length<2)return toast('Fail kosong',true);
  const h=rows[0].map(x=>x.toUpperCase());const ix=n=>h.findIndex(x=>x.includes(n));
  const iK=ix('KATEGORI'),iJ=ix('JENIS'),iA=ix('ACARA'),iU=ix('UNDIAN'),iN=ix('NAMA'),iP=Math.max(ix('PASUKAN'),ix('SEKOLAH'));
  if(iK<0||iJ<0||iN<0)return toast('Lajur KATEGORI, JENIS dan NAMA wajib ada',true);
  const g={},salah=[];
  rows.slice(1).forEach((r,n)=>{const nama=(r[iK]||'').trim();if(!nama||!(r[iN]||'').trim())return;const j=kodJenis(r[iJ]);
    if(!j){salah.push('Baris '+(n+2)+': JENIS "'+r[iJ]+'" tidak dikenali');return;}
    const key=nama.toUpperCase();g[key]=g[key]||{nama:key,jenis:j,acara:(iA>=0?r[iA]:'').trim().toUpperCase(),peserta:[]};
    g[key].peserta.push({undian:(iU>=0&&r[iU]?r[iU].replace(/\D/g,''):'')||String(g[key].peserta.length+1),nama:r[iN].trim(),pasukan:iP>=0?(r[iP]||'').trim():''});});
  PUKAL=Object.values(g);const ada=new Set((ST.meta.senarai||[]).map(x=>x.nama.toUpperCase()));
  $('#pukalPrev').innerHTML=`<table style="font-size:13px;margin-top:10px"><tr><th>KATEGORI</th><th>BORANG</th><th>ACARA</th><th class="num">PESERTA</th><th></th></tr>
    ${PUKAL.map(x=>`<tr><td class="up"><b>${esc(x.nama)}</b></td><td>${esc(namaBorang(x.jenis))}</td><td>${esc(x.acara)}</td><td class="num">${x.peserta.length}</td><td>${ada.has(x.nama)?'<span class="badge b-wait">SUDAH ADA · DILANGKAU</span>':'<span class="badge b-ok">BARU</span>'}</td></tr>`).join('')}</table>
    ${salah.length?`<p style="color:var(--bad);font-size:12px">${salah.map(esc).join('<br>')}</p>`:''}

}
async function importPukal(){

  for(const x of PUKAL){if(ada.has(x.nama))continue;const B=BORANG[x.jenis];const acara=x.acara||B.acara[0];
    const jenis=jenisSebenar(x.jenis,acara);const o={};x.peserta.forEach(p=>o[uidBaru()]=p);
    try{await ciptaKatData({nama:x.nama,jenis,acara,sasaran:masaLalai(x.jenis,acara),kaedah:B.kaedah||'jumlah',bilJuri:3,skala10:B.format==='PESAKA'},false,o);n++;}

async function pulihData(d){

/* Rumusan kesalahan setiap jurus (post mortem jurulatih) */
function rumusanData(k,rows){
  const B=BORANG[k.jenis];const it=B.sek.flatMap(s=>s.item).filter(x=>x.kira);if(!it.length)return null;
  const nJ=k.bilJuri||3;
  const L=susunUndian(rows).filter(r=>r.ada).map(r=>{const m=k.markah[r.id]||{};
    const sel=it.map(x=>{const per=Array.from({length:nJ},(_,i)=>m[i+1]&&!m[i+1].dq?(m[i+1].v[x.k]||0):null);const jum=per.reduce((t,v)=>t+(v||0),0);return{per,jum};});
    return{r,sel,jum:sel.reduce((t,c)=>t+c.jum,0)};});
  return{it,L};
}
function rumusanHTML(k,rows){
  const D=rumusanData(k,rows);if(!D||!D.L.length)return '';
  const th=D.it.map(x=>`<th class="num" title="Gerakan ${x.dari}–${x.hingga}">J${x.k.slice(1)}</th>`).join('');
  return `<div style="margin-top:18px;overflow-x:auto"><div class="row"><h3 class="grow" style="margin:0">📊 RUMUSAN KESALAHAN JURUS (POST MORTEM)</h3><button class="btn sm gold" onclick="cetakRumusan()">🖨 CETAK RUMUSAN</button></div>
   <p class="muted" style="font-size:12px;margin:4px 0 8px">Nombor = jumlah kesalahan semua juri. Kecil di bawah = J1 / J2 / J3.</p>
   <table style="font-size:12px"><tr><th>UNDIAN</th><th>NAMA</th>${th}<th class="num">JUMLAH</th></tr>
   ${D.L.map(x=>`<tr class="${x.r.dq?'ud':''}"><td class="num">${esc(x.r.undian)}</td><td class="up" style="min-width:140px"><b>${esc(x.r.nama)}</b>${x.r.dq?' <span class="badge b-ud">DQ</span>':''}</td>
     ${x.sel.map(c=>`<td class="num" style="${c.jum?'background:rgba(192,57,43,'+Math.min(.12+c.jum*.1,.55)+');color:var(--ink)':''}">${c.jum?'<b>'+c.jum+'</b><div style="font-size:9px">'+c.per.map(v=>v==null?'–':v).join(' / ')+'</div>':'<span class="muted">0</span>'}</td>`).join('')}
     <td class="num big">${x.jum}</td></tr>`).join('')}</table></div>`;
}

       <div class="jerr">${!ada&&RAW[it.k]&&RAW[it.k].length>=String(it.julat[1]).length?'Mesti nombor bulat '+it.julat[0]+' hingga '+it.julat[1]:''}</div>`
       :`<div class="opts">${it.adj.map(a=>{const v=it.m+a;return `<button class="opt ${ada&&v===cur?'on':''} ${!ada&&a===0?'m':''}" onclick="PIL['${it.k}']=${v};renderJuri()">${a>0?'+'+fx(a):fx(a)}</button>`;}).join('')}</div>`}</div>`;}).join('')}</div>`;}).join('')}
   ${B.jdq?`<button class="btn dqb" onclick="dqJuri()">⛔ DISKUALIFIKASI PESILAT</button>`:''}
   <div class="neu sek"><h2 class="up" style="margin:0 0 8px">📝 Catatan <span class="muted" style="font-size:13px;font-weight:700">(tidak wajib)</span></h2>
     <textarea id="jCat" maxlength="300" style="min-height:80px" placeholder="Catatan ringkas untuk rujukan KP / DJ..." oninput="CAT=this.value">${esc(CAT)}</textarea></div>
   <div class="jfoot"><div class="grow"><span class="prog ${lengkap?'jok':'jx'}">${lengkap?'✓ LENGKAP':'✗ '+siap+' / '+semua.length+' ITEM'}</span><div style="font-size:26px;font-weight:900">${lengkap?fx(s.jum):'—'}</div></div>
   <button class="btn ${lengkap?'ok':'pri'}" style="padding:15px 20px;font-size:15px" id="btnHantar" ${lengkap?'':'disabled'} onclick="hantar()">HANTAR MARKAH ✔</button></div></div>`;
}
function dqJuri(){
  modal(`<h2 style="color:var(--bad)">⛔ DISKUALIFIKASI</h2><p class="muted" style="margin-top:0">Pilih sebab. Cadangan akan dihantar ke KP / DJ (perlu persetujuan 2/3 juri).</p>
   ${SEBAB_DQ.map((x,i)=>`<label class="dqopt neu-in"><input type="radio" name="dqs" value="${esc(x)}" ${i?'':'checked'}> ${esc(x)}</label>`).join('')}
   <textarea id="dqTx" maxlength="200" style="min-height:60px" placeholder="Keterangan tambahan (pilihan), cth: Jurus 5–7"></textarea>
   <button class="btn" style="width:100%;margin-top:12px;background:var(--bad);color:#fff" onclick="hantarDQ()">SAHKAN DISKUALIFIKASI</button>`);
}
async function hantarDQ(){
  const k=ST.kat;const r=document.querySelector('input[name=dqs]:checked');const tx=$('#dqTx').value.trim();
  const sebab=r.value+(tx?' — '+tx:'');const v={};BORANG[k.jenis].sek.forEach(s=>s.item.forEach(it=>{if(PIL[it.k]!=null)v[it.k]=PIL[it.k];}));
  try{await DB.set('pub/kat/'+k.id+'/markah/'+k.semasa+'/'+String(JURI_NO||'1'),{v,c:(CAT||'').trim(),dq:{sebab,t:Date.now()},t:Date.now()});tutupModal();toast('Diskualifikasi dihantar');}
  catch(e){toast('Gagal: '+salahMsg(e),true);}
}
async function batalDQ(){
  const k=ST.kat;try{await DB.remove('pub/kat/'+k.id+'/markah/'+k.semasa+'/'+String(JURI_NO||'1'));UBAH=true;}catch(e){toast('Gagal: '+salahMsg(e),true);}
}
async function hantar(){
  const k=ST.kat;const B=BORANG[k.jenis];const v={};
  let kurang=0;B.sek.forEach(s=>s.item.forEach(it=>{if(it.kira){v[it.k]=PIL[it.k]||0;return;}if(PIL[it.k]==null)kurang++;v[it.k]=PIL[it.k];}));
  if(kurang)return toast('Masih ada '+kurang+' item belum dinilai (✗ merah).',true);
  const b=$('#btnHantar');b.disabled=true;b.textContent='MENGHANTAR...';
  try{await DB.set('pub/kat/'+k.id+'/markah/'+k.semasa+'/'+String(JURI_NO||'1'),{v,c:(CAT||'').trim(),t:Date.now()});
    UBAH=false;renderJuri();toast('Markah dihantar');}
  catch(e){toast('Gagal: '+salahMsg(e),true);b.disabled=false;b.textContent='CUBA LAGI';}
}

/* ---------- PENONTON ---------- */
function renderPenonton(){
  const k=ST.kat,m=ST.meta||{};
  if(m.rehat){$('#app').innerHTML=`<div class="pen" style="justify-content:center;align-items:center;text-align:center"><div class="muted up" style="font-size:2vw;font-weight:800">${esc(m.kejohanan||'')}</div><div class="nm" style="font-size:8vw">⏸ REHAT SEBENTAR</div><div class="ps">${esc(m.rehatMsg||'Pertandingan akan disambung sebentar lagi')}</div></div>`;return;}
  if(!k){$('#app').innerHTML=`<div class="pen"><div class="kat">${esc(m.kejohanan||'PERTANDINGAN SENI SILAT')}</div></div>`;return;}
  const {rows,sah}=kira(k);const p=rows.find(r=>r.id===k.semasa);
  $('#app').innerHTML=`<div class="pen">
   <div class="row"><div class="grow"><div class="muted up" style="font-size:1.6vw;font-weight:800">${esc(m.kejohanan||'')}</div><div class="kat">${esc(k.nama)} • ${esc(k.acara)}</div></div><span class="noprint" style="opacity:.4">${temaBtn()}</span></div>
   <div class="neu main">${p?`<div style="text-align:center"><div class="muted" style="font-size:1.6vw;font-weight:800">GILIRAN</div><div class="gil">${esc(p.undian)}</div></div>
     <div><div class="nm">${esc(p.nama)}</div><div class="ps">${esc(p.pasukan)}</div>
     ${k.paparMarkah&&p.lengkap?`<div class="skor">${skor(p)}</div>`:''}</div>`:`<div></div><div class="nm muted">SILA TUNGGU...</div>`}</div>
   ${k.paparMarkah&&sah.length?`<div class="neu card"><table><tr><th>KED.</th><th>UNDIAN</th><th>NAMA</th><th>PASUKAN</th><th class="num">MARKAH</th></tr>
     ${sah.slice(0,8).map(r=>`<tr><td class="num"><b>${r.kedudukan}</b></td><td class="num">${esc(r.undian)}</td><td class="up"><b>${esc(r.nama)}</b></td><td class="up">${esc(r.pasukan)}</td><td class="num"><b>${skor(r)}</b></td></tr>`).join('')}</table></div>`:''}
  </div>`;
}

/* ---------- PIN / LOG MASUK (SATU PERANTI SATU SESI) ---------- */
function renderLogin(){
  const juri=VIEW==='juri';const pertama=!juri&&SEDIA===false;
  const mod=(pertama?'baru':'pin')+(TENDANG?'t':'')+(SEDIA===null?'x':'');
  if(LOGIN_UI===mod)return;LOGIN_UI=mod;
  const tajuk=juri?'JURI '+esc(JURI_NO):'KETUA PERTANDINGAN / DEWAN JURI';
  $('#app').innerHTML=`<div class="wrap" style="max-width:440px;padding-top:6vh">
   <div class="neu card" style="text-align:center"><div class="logo" style="margin:0 auto 14px;width:64px;height:64px;font-size:22px">${juri?'J'+esc(JURI_NO):'KP'}</div>
   <h1>${tajuk}</h1>
   ${TENDANG?'<div class="notis">⚠ Sesi ditamatkan: peranti lain telah log masuk dengan PIN ini.</div>':''}
   ${SEDIA===null?'<p class="muted">Menyambung...</p>':pertama?`<p class="muted">Kali pertama: cipta PIN untuk KP dan setiap juri.</p>
     <label style="text-align:left">PIN KP / DJ (wajib)</label><input id="pKP" inputmode="numeric" style="width:100%;margin-bottom:10px">
     ${[1,2,3,4,5].map(n=>`<label style="text-align:left">PIN Juri ${n}${n>3?' (jika 5 juri)':''}</label><input id="pJ${n}" inputmode="numeric" style="width:100%;margin-bottom:10px">`).join('')}
     <button class="btn pri" style="width:100%" onclick="ciptaPin()">SIMPAN PIN & MASUK</button>`
   :`<p class="muted">Masukkan PIN</p>
     <input id="pin" type="password" inputmode="numeric" autocomplete="off" style="width:100%;font-size:28px;text-align:center;letter-spacing:10px" onkeydown="if(event.key==='Enter')masuk()">
     <button class="btn pri" id="btnMasuk" style="width:100%;margin-top:14px" onclick="masuk()">MASUK</button>`}
   <div class="row" style="margin-top:14px;justify-content:center">${netBadge()}${temaBtn()}</div></div></div>`;
  const f=$('#pin')||$('#pKP');if(f)f.focus();
}
async function masukDgn(pin){
  await DB.set('login/'+ROLE+'/'+UID,String(pin));   /* Firebase semak PIN */
  await DB.set('sesi/'+ROLE,UID);                     /* peranti lama auto log keluar */
}
async function masuk(){
  const v=$('#pin').value.trim();if(!v)return;const b=$('#btnMasuk');b.disabled=true;
  try{await masukDgn(v);TENDANG=false;toast('Berjaya masuk');}catch(e){toast('PIN SALAH',true);b.disabled=false;$('#pin').value='';}
}
async function ciptaPin(){
  const b={kp:$('#pKP').value.trim()};[1,2,3,4,5].forEach(n=>b['juri'+n]=$('#pJ'+n).value.trim());
  if(!b.kp)return toast('PIN KP wajib diisi',true);
  Object.keys(b).forEach(k=>{if(!b[k])delete b[k];});
  try{await DB.set('rahsia',b);await DB.set('sedia',true);await masukDgn(b.kp);toast('PIN disimpan');}catch(e){toast('Gagal: '+salahMsg(e),true);}
}
async function tetapPin(){
  let p={};try{p=await DB.get('rahsia')||{};}catch(e){return toast('Gagal: '+salahMsg(e),true);}
  modal(`<h2>🔑 TETAPAN PIN</h2><p class="muted">Berikan PIN juri kepada setiap juri. Kosongkan = tidak berubah.</p>
   <label>PIN KP / DJ</label><input id="pKP" value="${esc(p.kp||'')}" style="width:100%;margin-bottom:10px">
   ${[1,2,3,4,5].map(n=>`<label>PIN Juri ${n}</label><input id="pJ${n}" value="${esc(p['juri'+n]||'')}" style="width:100%;margin-bottom:10px">`).join('')}
   <button class="btn pri" style="width:100%" onclick="simpanPin()">SIMPAN</button>`);
}
async function simpanPin(){
  const b={kp:$('#pKP').value.trim()};[1,2,3,4,5].forEach(n=>b['juri'+n]=$('#pJ'+n).value.trim());
  Object.keys(b).forEach(k=>{if(!b[k])delete b[k];});
  try{await DB.update('rahsia',b);if(b.kp)await DB.set('login/kp/'+UID,b.kp);tutupModal();toast('PIN dikemas kini');}catch(e){toast('Gagal: '+salahMsg(e),true);}
}
async function keluar(){try{await DB.remove('sesi/'+ROLE);}catch(e){}LOGGED=false;TENDANG=false;render();}
const netBadge=()=>`<span class="net neu-in ${ONLINE?'on':''}" id="net"><i></i>${ONLINE?'DALAM TALIAN':'LUAR TALIAN'}</span>`;
function renderSetup(){
  $('#app').innerHTML=`<div class="wrap" style="max-width:640px;padding-top:6vh"><div class="neu card"><h1>⚙ TETAPAN BELUM LENGKAP</h1>
   <p>Sila isi <b>FIREBASE_CONFIG</b> di bahagian atas fail <b>index.html</b>. Rujuk <b>PANDUAN.md</b> langkah 1–4.</p></div></div>`;
}

/* ---------- 5 JURI: lajur dinamik ---------- */
const thJ=n=>Array.from({length:n},(_,i)=>`<th class="num">J${i+1}</th>`).join('');
const tdJ=r=>r.j.map((x,i)=>`<td class="num">${r.jdq&&r.jdq.some(d=>d.j===i+1)?'<span class="jx" title="Diskualifikasi">⛔</span>':r.ud?'—':x==null?'<span class="jx" title="Belum hantar">✗</span>':r.buang&&r.buang.includes(i+1)?'<s class="jok" style="opacity:.55">✓ '+fx(x)+'</s>':'<span class="jok">✓ '+fx(x)+'</span>'}</td>`).join('');

/* ---------- CETAK BORANG MARKAH JURI (BANTAHAN) ---------- */
function cetakBorang(pid){
  const k=ST.kat,m=ST.meta||{};const B=BORANG[k.jenis];const nJ=k.bilJuri||3;
  const r=kira(k).rows.find(x=>x.id===pid);const mk=k.markah[pid]||{};
  const J=Array.from({length:nJ},(_,i)=>i+1);
  const nil=(j,it)=>mk[j]?(mk[j].v[it.k]!=null?mk[j].v[it.k]:it.m):null;
  const td='style="text-align:center"';
  let body='';
  B.sek.forEach(sk=>{
    body+=`<tr><th colspan="${3+nJ}" style="text-align:left">${sk.k}. ${esc(sk.n)}</th></tr>`;
    sk.item.forEach(it=>{body+=`<tr><td>${esc(it.n)}</td><td ${td}>${it.mak||'-'}</td><td ${td}>${it.kira?'SALAH':it.julat?it.julat.join('–'):it.mak?it.m:'-'}</td>${J.map(j=>`<td ${td}>${fx(nil(j,it))}</td>`).join('')}</tr>`;});
    body+=`<tr><td style="text-align:right"><b>JUMLAH ${sk.k}</b></td><td></td><td></td>${J.map(j=>`<td ${td}><b>${mk[j]?fx(skorJuri(k.jenis,mk[j].v).sek[sk.k]):'—'}</b></td>`).join('')}</tr>`;
  });
  body+=`<tr><th colspan="3" style="text-align:right">JUMLAH BESAR JURI</th>${J.map(j=>`<th ${td}>${fx(r.j[j-1])}${r.buang.includes(j)?' (DIBUANG)':''}${mk[j]&&mk[j].ed?'<br><small>(DIUBAH KP/DJ)</small>':''}</th>`).join('')}</tr>`;
  body+=`<tr><td><b>CATATAN JURI</b></td><td></td><td></td>${J.map(j=>`<td style="font-size:10px">${mk[j]&&mk[j].c?esc(mk[j].c):''}</td>`).join('')}</tr>`;
  const tol=k.tolak[pid]||{};
  const tolRows=senaraiTolak(k).filter(p=>tol[p.k]).map(p=>{let v=tol[p.k]*p.v;if(p.max)v=Math.min(v,p.max);return `<tr><td>${esc(p.n)}</td><td ${td}>${tol[p.k]}</td><td ${td}>${v}</td></tr>`;}).join('');
  $('#cetak').innerHTML=`<h1>${esc(m.kejohanan||'PERTANDINGAN SENI SILAT')}</h1>
   <h2>BORANG PERINCIAN MARKAH JURI — ${esc(namaBorang(k.jenis))} — ACARA ${esc(k.acara)}</h2>
   <table style="width:100%;margin-bottom:10px"><tr><th>KATEGORI</th><td>${esc(k.nama)}</td><th>UNDIAN</th><td>${esc(r.undian)}</td></tr>
   <tr><th>NAMA</th><td>${esc(r.nama)}</td><th>PASUKAN</th><td>${esc(r.pasukan)}</td></tr></table>
   <table style="width:100%"><tr><th>UNSUR</th><th>MAK</th><th>M</th>${J.map(j=>`<th>JURI ${j}</th>`).join('')}</tr>${body}</table>
   <table style="width:60%;margin-top:10px"><tr><th>PENOLAKAN</th><th>BIL.</th><th>NILAI</th></tr>${tolRows}
   <tr><td>MASA (${mmss(r.saat)} / SASARAN ${mmss(k.masa.sasaran)})</td><td ${td}>-</td><td ${td}>${r.tm}</td></tr>
   <tr><th style="text-align:right" colspan="2">JUMLAH PENOLAKAN</th><th>${r.tolak}</th></tr></table>
   <h2 style="text-align:left;margin-top:10px">MARKAH AKHIR (${k.kaedah==='purata'?'PURATA':k.kaedah==='median'?'MEDIAN (PURATA '+fx(r.purata)+')':'JUMLAH'}${r.buang.length?', BUANG TERTINGGI & TERENDAH':''}): ${skor(r)} ${r.kedudukan?'— KEDUDUKAN '+r.kedudukan:''}</h2>
   <div class="sign"><div>PENGESAHAN KETUA PERTANDINGAN<br><br><br>.................................................<br>${esc(k.sah?k.sah.oleh:'')}</div>
   <div>PENGESAHAN DEWAN JURI<br><br><br>.................................................<br>${esc(k.sah?k.sah.dj:'')}</div></div>
   <p style="font-size:10px">DICETAK PADA ${new Date().toLocaleString('ms-MY')} ${k.sah?'• KEPUTUSAN DISAHKAN':'• DRAF'}</p>`;
  window.print();
}

/* ======================= MULA ======================= */
(async()=>{
  if(!DB)return render();
  try{UID=await DB.init();}catch(e){$('#app').innerHTML='<div class="wrap"><div class="neu card"><h2>Gagal sambung Firebase</h2><p>'+esc(salahMsg(e))+'</p><p class="muted">Pastikan Anonymous sign-in diaktifkan (PANDUAN langkah 3).</p></div></div>';return;}
  DB.connected(ok=>{ONLINE=ok;const el=$('#net');if(el)el.outerHTML=netBadge();});
  if(ROLE){
    DB.on('sedia',v=>{SEDIA=!!v;if(!LOGGED)render();});
    DB.on('sesi/'+ROLE,v=>{const dulu=LOGGED;LOGGED=(v===UID);if(dulu&&!LOGGED&&v)TENDANG=true;if(dulu!==LOGGED)render();});
  }
  pantau();render();
  if(ROLE&&window.DEMO_PIN&&window.DEMO_PIN[ROLE])setTimeout(()=>{if(!LOGGED)masukDgn(window.DEMO_PIN[ROLE]).catch(()=>{});},300);
})();

</script>
</body>
